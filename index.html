<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Розклад КПІ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #e8e4dc; --card: #ffffff; --soft: #f1eee8; --ink: #121212; --muted: #55524c; --border: rgba(18, 18, 18, .07);
    --tm: #121212; --tm-ink: #ffffff;
    --green: #8dca8e; --salmon: #f5a48c; --yellow: #e8e382;
    --on: #151515; --pill: #151515; --pill-ink: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px rgba(0, 0, 0, .06);
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0c; --card: #232323; --soft: #2e2e2e; --ink: #f6f6f3; --muted: #bdbab3; --border: rgba(255, 255, 255, .08);
    --tm: #f6f6f3; --tm-ink: #121212; --pill: #111111; --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.35 Outfit, Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 0 18px calc(32px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:active { transform: scale(.97); }
  svg { display: block; }

  /* ---- шапка ---- */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 4px; }
  .hi { font-size: 20px; font-weight: 500; }
  .hi b { font-weight: 700; }
  .grp { display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .grp .cap { width: 20px; height: 20px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; }
  .grp .cap svg { width: 12px; height: 12px; color: var(--on); }
  .grp .chev { width: 14px; height: 14px; }
  .lock { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--card);
    display: grid; place-items: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .lock svg { width: 22px; height: 22px; }
  .lock.on { background: var(--green); color: var(--on); }
  h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin: 18px 0 8px; }
  .lead { font-size: 16px; color: var(--muted); font-weight: 500; }

  /* ---- вкладки ---- */
  .tabs { display: flex; gap: 6px; margin: 20px 0 4px; }
  .tabs button { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 6px 0 12px;
    border-radius: 21px; background: var(--card); font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); border: 1px solid var(--border); transition: background .2s; white-space: nowrap; }
  .tabs button i { font-style: normal; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--soft);
    font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs button.on i { background: var(--salmon); color: var(--on); }
  .tabs button.noc { padding-right: 12px; }

  /* ---- велика картка ---- */
  .hero { position: relative; overflow: hidden; border-radius: 30px; padding: 20px; margin-top: 16px; color: var(--on); }
  .hero.green { background: var(--green); } .hero.yellow { background: var(--yellow); } .hero.salmon { background: var(--salmon); }
  .deco { position: absolute; top: 10px; right: 8px; width: 112px; height: 84px; pointer-events: none; }
  .status { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px;
    background: rgba(255, 255, 255, .55); font-size: 13.5px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5372b; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 55, 43, .5); } 75%, 100% { box-shadow: 0 0 0 7px rgba(229, 55, 43, 0); } }
  .hero h2 { font-size: 27px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; margin: 40px 0 8px; }
  .hero .by { font-size: 16px; font-weight: 600; opacity: .85; }
  .prog { height: 8px; border-radius: 4px; background: rgba(21, 21, 21, .12); margin: 18px 0 8px; overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 4px; background: var(--on); }
  .prog-l { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .prog-l { font-size: 14px; font-weight: 700; }
  .prog-l span:first-child, .prog-l span:last-child { opacity: .7; }
  .when { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .when span { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px;
    background: rgba(255, 255, 255, .55); font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .go { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 60px; margin-top: 18px;
    padding: 0 8px 0 22px; border-radius: 30px; background: var(--pill); color: var(--pill-ink); font-size: 17px; font-weight: 600; }
  .go + .go { margin-top: 8px; }
  .go b { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #151515; display: grid; place-items: center; }
  .go b svg { width: 18px; height: 18px; margin-left: 2px; }
  .next-line { margin-top: 14px; font-size: 15px; font-weight: 600; opacity: .85; }

  /* ---- список ---- */
  .sec { display: flex; justify-content: space-between; align-items: center; margin: 28px 2px 12px; }
  .sec b { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .count { height: 30px; padding: 0 13px; border-radius: 15px; background: var(--salmon); color: var(--on);
    font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; }
  .count.ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow); border: 1px solid var(--border); }
  .row { display: flex; gap: 14px; background: var(--card); border-radius: 24px; padding: 16px; margin-bottom: 10px;
    box-shadow: var(--shadow); border: 1px solid var(--border); }
  .row.live { border: 2.5px solid var(--green); padding: 14.5px; }
  .row.past { opacity: .5; }
  .tm { flex: none; width: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 9px 0; border-radius: 16px; background: var(--tm); color: var(--tm-ink); font-variant-numeric: tabular-nums; align-self: flex-start; }
  .tm b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .tm span { font-size: 12.5px; font-weight: 600; opacity: .72; }
  .tm em { font-style: normal; font-size: 11px; font-weight: 600; opacity: .72; margin-top: 2px; }
  .row.live .tm { background: var(--green); color: var(--on); }
  
  .bd { flex: 1; min-width: 0; }
  .nm { font-size: 17px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .mt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .tag { height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12.5px; font-weight: 700; color: var(--on); display: inline-flex; align-items: center; }
  .tag.lec { background: var(--salmon); } .tag.prac { background: var(--green); } .tag.lab { background: var(--yellow); }
  .tag.now { background: var(--ink); color: var(--bg); }
  .only { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .act { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 6px; border-radius: 20px;
    background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; }
  .act b { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); color: var(--ink); display: grid; place-items: center; }
  .act b svg { width: 12px; height: 12px; margin-left: 1px; }
  .act.light { background: var(--card); color: var(--ink); padding: 0 16px 0 12px; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .act.light svg { width: 17px; height: 17px; }
  .empty { background: var(--card); border-radius: 24px; padding: 26px 18px; text-align: center; color: var(--ink);
    font-weight: 600; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .empty span { display: block; font-size: 30px; margin-bottom: 6px; }
  .err { color: #d0392b; }

  /* ---- перемикач тижнів ---- */
  .wk { display: flex; background: var(--card); border-radius: 22px; padding: 4px; margin-top: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .wk button { flex: 1; height: 38px; border-radius: 18px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .wk button.on { background: var(--ink); color: var(--bg); }

  /* ---- окремі сторінки (група, доступ) ---- */
  .page-top { display: flex; align-items: center; gap: 12px; padding: 18px 0 0; }
  .back { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .back svg { width: 20px; height: 20px; }
  .page-top b { font-size: 18px; font-weight: 700; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 22px; padding: 0 16px; margin: 18px 0 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--ink); padding: 14px 0; }
  .search input::placeholder { color: var(--muted); }
  .glist button { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 8px; font-weight: 700; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .glist small { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); padding: 12px 4px; }

  .ac-hero { padding: 24px 22px; margin-top: 18px; }
  .ac-hero .big { width: 64px; height: 64px; border-radius: 50%; background: var(--pill); color: #fff; display: grid; place-items: center; }
  .ac-hero .big svg { width: 30px; height: 30px; }
  .ac-hero h2 { margin: 18px 0 8px; }
  .ac-hero p { font-size: 16px; font-weight: 500; margin: 0; opacity: .85; }
  .step { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .step i { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--salmon); color: var(--on);
    font-style: normal; font-weight: 600; display: grid; place-items: center; }
  .step div { font-size: 16px; font-weight: 700; padding-top: 5px; }
  .step small { display: block; color: var(--muted); font-size: 14px; font-weight: 500; margin-top: 4px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 29px;
    font-size: 17px; font-weight: 600; margin-top: 10px; }
  .btn.dark { background: var(--ink); color: var(--bg); }
  .btn.text { height: 44px; color: var(--muted); font-size: 14px; }
  .btn svg { width: 20px; height: 20px; }
  .note { font-size: 14px; font-weight: 500; color: var(--muted); text-align: center; margin: 12px 8px 0; }

  .toast { position: fixed; left: 50%; top: 14px; z-index: 30; transform: translate(-50%, -140%); width: max-content; max-width: calc(100% - 32px);
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 22px; font-size: 14px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .2); transition: transform .35s cubic-bezier(.2, .8, .2, 1); text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  .foot { text-align: center; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 28px; }
  .foot a { color: var(--muted); }
</style>
</head>

  var toastTimer;
  function toast(text) {

  var state = { view: 'today', weekShift: 0, data: null, currentWeek: null, refDate: null, baseDate: null,
                group: loadGroup(), vault: null, code: null, owner: false };
  var LINKS = [];

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function loadGroup() {

  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---- дата/час у київському часовому поясі ----
  function kyivNow() {
    var p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date())
      .forEach(function (x) { p[x.type] = x.value; });
    return { y: +p.year, m: +p.month, d: +p.day, min: (+p.hour % 24) * 60 + (+p.minute) };
  }
  function dateUTC(y, m, d) { return new Date(Date.UTC(y, m - 1, d)); }
  function addDays(dt, n) { return new Date(dt.getTime() + n * 86400000); }
  function iso(dt) { return dt.toISOString().slice(0, 10); }
  function dow(dt) { return (dt.getUTCDay() + 6) % 7; } // 0 = Пн … 6 = Нд
  function monday(dt) { return addDays(dt, -dow(dt)); }
  function human(dt) { return dt.getUTCDate() + ' ' + MONTHS[dt.getUTCMonth()]; }
  function toMin(hhmm) { var a = hhmm.split(':'); return +a[0] * 60 + +a[1]; }
  function pairs(n) { var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? 'пара' : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? 'пари' : 'пар'); }

  function weekOf(dt) {
    var diff = Math.round((monday(dt) - monday(state.refDate)) / (7 * 86400000));
    return ((state.currentWeek - 1 + diff) % 2 + 2) % 2 + 1;
  }

  function pairsFor(dt) {
    var d = dow(dt);
    if (d > 5 || !state.data) return [];
    var wk = weekOf(dt) === 1 ? state.data.scheduleFirstWeek : state.data.scheduleSecondWeek;
    var day = (wk || []).filter(function (x) { return x.day === DAYS[d]; })[0];
    if (!day) return [];
    var key = iso(dt);
    return day.pairs.filter(function (p) { return !p.dates || !p.dates.length || p.dates.indexOf(key) >= 0; })
      .map(function (p) {
        var s = p.time.slice(0, 5), b = BELLS[s];
        var e = b ? b[0] : (function () { var m = toMin(s) + 95; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); })();
        return { start: s, end: e, num: b ? b[1] : '', name: p.name, type: p.type, tag: p.tag,
                 teacher: p.lecturer && p.lecturer.name, place: p.location, dates: p.dates || [] };
      })
      .sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
  }

  // ---- посилання ----
  function linksFor(name) {
    if (!state.vault || state.group.id !== state.vault.group) return [];
    var n = String(name || '').toLowerCase(), out = [];
    state.vault.items.forEach(function (it) {
      if (n.indexOf(it.match.toLowerCase()) >= 0) out = out.concat(it.links);
    });
    return out;
  }
  function linkRef(l) { LINKS.push(l); return LINKS.length - 1; }
  function rowActions(name) {
    var ls = linksFor(name);
    if (!ls.length) return '';
    return '<div class="acts">' + ls.map(function (l) {
      if (l.kind === 'classroom') return '<button class="act light" data-li="' + linkRef(l) + '">' + IC.cap + 'Classroom</button>';
      return '<button class="act" data-li="' + linkRef(l) + '"><b>' + IC.play + '</b>' + esc(KIND[l.kind] || l.kind) + '</button>';
    }).join('') + '</div>';
  }
  function bigButtons(name, verb) {
    return linksFor(name).filter(function (l) { return l.kind !== 'classroom'; }).map(function (l) {
      return '<button class="go" data-li="' + linkRef(l) + '"><span>' + verb + ' · ' + esc(KIND[l.kind] || l.kind) + '</span><b>' + IC.play + '</b></button>';
    }).join('');
  }
  function openLink(url) {
    haptic('imp', 'light');

  }

  // ---- доступ: розшифрування, збереження, запрошення ----
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function normCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function decrypt(code) {
    if (!VAULT || !window.crypto || !crypto.subtle) return Promise.reject(new Error('unsupported'));
    var raw = b64(VAULT), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(normCode(code)), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: VAULT_ITER, hash: 'SHA-256' },
          k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function grant(code, vault, owner) {
    state.vault = vault; state.code = normCode(code);
    store(CODE_KEY, state.code);
    if (inTg && tg.CloudStorage) { try { tg.CloudStorage.setItem(CODE_KEY, state.code); } catch (e) {} }
    if (owner) {
      state.owner = true; store(OWNER_KEY, '1');
      if (inTg && tg.CloudStorage) { try { tg.CloudStorage.setItem(OWNER_KEY, '1'); } catch (e) {} }
    }
    updateLock(); render();
  }
  function revoke() {
    state.vault = null; state.code = null; state.owner = false;
    drop(CODE_KEY); drop(OWNER_KEY);
    if (inTg && tg.CloudStorage) { try { tg.CloudStorage.removeItems([CODE_KEY, OWNER_KEY]); } catch (e) {} }
    updateLock(); render();
  }
  function inviteLink() { return 'https://t.me/' + BOT + '?startapp=k_' + state.code; }
  function shareInvite() {
    var link = inviteLink(), text = 'Розклад ' + state.group.name + ' з посиланнями на Zoom і Meet. Натисни, щоб відкрити:';
    haptic('imp', 'medium');

    if (navigator.clipboard) navigator.clipboard.writeText(link).then(function () { toast('Посилання скопійовано'); });
  }
  function restoreAccess() {
    restoreOwner();

    if (sp && (sp.indexOf('k_') === 0 || sp.indexOf('o_') === 0)) {
      var c = sp.slice(2), own = sp.charAt(0) === 'o';
      decrypt(c).then(function (v) {

      }).catch(function () { toast('Запрошення недійсне — попросіть нове'); haptic('n', 'error'); fromStorage(); });

  // ---- розмітка ----
  function shortName(n) {

  function dur(min) {
    var h = Math.floor(min / 60), m = min % 60;

  function rowHtml(p, opts) {
    opts = opts || {};
    var t = tagOf(p), cls = 'row' + (opts.live ? ' live' : '') + (opts.past ? ' past' : '');
    var only = opts.showDates && p.dates.length

      '<span>' + esc(shortName(p.teacher)) + (p.place ? ' · ' + esc(p.place) : '') + '</span></div>' + only +
      (opts.past ? '' : rowActions(p.name)) + '</div></div>';

  function nextDayWithPairs(from) {
    for (var i = 1; i <= 14; i++) { var d = addDays(from, i); if (pairsFor(d).length) return d; }
    return null;
  }

  function heroHtml(dt, list, now) {
    var live = null, next = null;
    list.forEach(function (p) {
      if (now.min >= toMin(p.start) && now.min < toMin(p.end)) live = p;
      else if (!next && toMin(p.start) > now.min) next = p;
    });
    if (live) {
      var total = toMin(live.end) - toMin(live.start), done = now.min - toMin(live.start);
      return '<section class="hero green">' + deco('#f5a48c', '#e8e382') +
        '<span class="status"><i class="dot"></i>Зараз іде' + (live.num ? ' · ' + live.num + ' пара' : '') + '</span>' +
        '<h2>' + esc(live.name) + '</h2><div class="by">' + esc(shortName(live.teacher)) + ' · ' + tagOf(live)[1] + '</div>' +
        '<div class="prog"><i style="width:' + Math.round(done / total * 100) + '%"></i></div>' +
        '<div class="prog-l"><span>' + live.start + '</span><span>ще ' + dur(toMin(live.end) - now.min) + '</span><span>' + live.end + '</span></div>' +
        bigButtons(live.name, 'Приєднатися') +
        (next ? '<div class="next-line">Далі о ' + next.start + ' — ' + esc(next.name) + '</div>' : '') + '</section>';
    }
    if (next) {
      var wait = toMin(next.start) - now.min;
      return '<section class="hero yellow">' + deco('#8dca8e', '#f5a48c') +
        '<span class="status">Наступна пара · через ' + dur(wait) + '</span>' +
        '<h2>' + esc(next.name) + '</h2><div class="by">' + esc(shortName(next.teacher)) + ' · ' + tagOf(next)[1] + '</div>' +
        '<div class="when"><span>' + next.start + ' – ' + next.end + '</span>' + (next.num ? '<span>' + next.num + ' пара</span>' : '') + '</div>' +
        bigButtons(next.name, 'Відкрити') + '</section>';
    }
    var nd = nextDayWithPairs(dt), np = nd && pairsFor(nd)[0];
    return '<section class="hero salmon">' + deco('#e8e382', '#8dca8e') +
      '<span class="status">' + (list.length ? 'Пари на сьогодні закінчились' : 'Сьогодні пар немає') + '</span>' +
      (np ? '<h2>' + esc(np.name) + '</h2><div class="by">Наступна пара</div><div class="when"><span>' +
        DAY_FULL[dow(nd)] + ', ' + human(nd) + '</span><span>' + np.start + '</span></div>'
        : '<h2>Відпочивайте</h2>') + '</section>';
  }

  function dayList(list, opts) {
    var now = kyivNow(), html = '';
    if (!list.length) return '<div class="empty"><span>🎉</span>Пар немає</div>';
    list.forEach(function (p) {
      var o = { showDates: opts.showDates };
      if (opts.today) { o.live = now.min >= toMin(p.start) && now.min < toMin(p.end); o.past = now.min >= toMin(p.end); }
      html += rowHtml(p, o);
    });
    return html;
  }

  function weekCount(mon) {
    var n = 0;
    for (var i = 0; i < 6; i++) n += pairsFor(addDays(mon, i)).length;
    return n;
  }

  function render() {
    if (!state.data || !document.getElementById('page').hidden) return;
    LINKS = [];
    var n = kyivNow(), main = document.getElementById('main');
    var today = state.baseDate = dateUTC(n.y, n.m, n.d), tomorrow = addDays(today, 1);
    var todayList = pairsFor(today), tomList = pairsFor(tomorrow);
    var counts = { today: todayList.length, tomorrow: tomList.length, week: weekCount(monday(today)) };
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      var c = counts[b.getAttribute('data-v')], i = b.querySelector('i');
      i.textContent = c; i.style.display = c ? '' : 'none';
      b.classList.toggle('noc', !c);
    });
    document.getElementById('grpName').textContent = state.group.name;
    var title = document.getElementById('title'), lead = document.getElementById('lead'), html = '';

    if (state.view === 'today') {
      title.innerHTML = DAY_FULL[dow(today)] + ',<br>' + human(today);
      lead.textContent = weekOf(today) + '-й тиждень · ' + (todayList.length ? pairs(todayList.length) : 'вихідний');
      html += heroHtml(today, todayList, n);
      if (todayList.length) {
        html += '<div class="sec"><b>Пари на сьогодні</b><span class="count">' + pairs(todayList.length) + '</span></div>';
        html += dayList(todayList, { today: true });
      }
    } else if (state.view === 'tomorrow') {
      title.innerHTML = DAY_FULL[dow(tomorrow)] + ',<br>' + human(tomorrow);
      lead.textContent = 'Завтра · ' + weekOf(tomorrow) + '-й тиждень';
      html += '<div class="sec"><b>Пари на завтра</b><span class="count' + (tomList.length ? '' : ' ghost') + '">' +
        (tomList.length ? pairs(tomList.length) : 'вихідний') + '</span></div>';
      html += dayList(tomList, {});
    } else {
      var mon = addDays(monday(today), 7 * state.weekShift);

      lead.textContent = human(mon) + ' – ' + human(addDays(mon, 5)) + ' · ' + weekOf(mon) + '-й тиждень';
      html += '<div class="wk"><button data-w="0" class="' + (state.weekShift === 0 ? 'on' : '') + '">Цей тиждень</button>' +
        '<button data-w="1" class="' + (state.weekShift === 1 ? 'on' : '') + '">Наступний</button></div>';
      var any = false;
      for (var i = 0; i < 6; i++) {
        var d = addDays(mon, i), list = pairsFor(d), isToday = iso(d) === iso(today);
        if (!list.length) continue;
        any = true;
        html += '<div class="sec"><b>' + DAY_FULL[i] + '</b><span class="count' + (isToday ? '' : ' ghost') + '">' +
          (isToday ? 'сьогодні' : human(d)) + '</span></div>';
        html += dayList(list, { showDates: true });
      }
      if (!any) html += '<div class="empty" style="margin-top:16px"><span>🎉</span>Пар немає</div>';
    }
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('[data-w]'), function (b) {
      b.onclick = function () {
        var w = +b.getAttribute('data-w');

      };
    });
  }

  function getJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function load() {
    var gid = state.group.id;
    var cached = read('rozklad_cache_' + gid);
    if (cached) {
      try { var c = JSON.parse(cached); if (c.ref) { state.data = c.data; state.currentWeek = c.week; state.refDate = new Date(c.ref + 'T00:00:00Z'); render(); } } catch (e) {}
    }
    Promise.all([getJSON(API + '/schedule/lessons?groupId=' + encodeURIComponent(gid)), getJSON(API + '/time/current')])
      .then(function (r) {

        render();

      .catch(function () {
        if (!state.data) {
          document.getElementById('lead').textContent = 'Немає зв’язку';
          document.getElementById('main').innerHTML = '<div class="empty err" style="margin-top:16px">Не вдалося завантажити розклад. Перевірте інтернет і відкрийте ще раз.</div>';
        }

  // ---- окремі сторінки ----

  function closePage() {
    var page = document.getElementById('page');

    page.hidden = true; page.innerHTML = '';
    document.getElementById('home').hidden = false;
    if (inTg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
    render();
  }
  if (inTg && tg.BackButton) { try { tg.BackButton.onClick(closePage); } catch (e) {} }
  function pageTop(title) { return '<div class="page-top"><button class="back" aria-label="Назад">' + IC.back + '</button><b>' + title + '</b></div>'; }

  var groupsCache = null;
  function openGroupPicker() {
    showPage(pageTop('Вибір групи') + '<label class="search">' + IC.search +
      '<input id="q" placeholder="Назва групи, напр. ГС-61мп" autocomplete="off"></label>' +
      '<div class="glist" id="gl"><div class="hint">Завантаження списку груп…</div></div>');
    var q = document.getElementById('q'), gl = document.getElementById('gl');
    function draw() {
      if (!groupsCache) return;
      var s = q.value.trim().toLowerCase();
      var list = groupsCache.filter(function (g) { return !s || g.name.toLowerCase().indexOf(s) >= 0; }).slice(0, 40);
      gl.innerHTML = list.map(function (g) {
        return '<button data-id="' + g.id + '" data-name="' + esc(g.name) + '"><span>' + esc(g.name) + '</span><small>' + esc(g.faculty || '') + '</small></button>';
      }).join('') || '<div class="hint">Нічого не знайдено</div>';
      Array.prototype.forEach.call(gl.querySelectorAll('button'), function (b) {
        b.onclick = function () {
          haptic('sel');
          state.group = { id: b.getAttribute('data-id'), name: b.getAttribute('data-name') };
          store('rozklad_group', JSON.stringify(state.group));
          state.data = null; state.view = 'today'; setTabs(); closePage(); load();
        };
      });
    }
    q.oninput = draw;
    if (groupsCache) draw();
    else getJSON(API + '/schedule/groups').then(function (g) { groupsCache = g.data || g; draw(); })
      .catch(function () { gl.innerHTML = '<div class="hint err">Не вдалося завантажити список груп</div>'; });
  }

  function openAccess() {
    if (state.vault && !state.owner) {
      showPage(pageTop('Посилання на пари') +
        '<section class="hero green ac-hero">' + deco('#f5a48c', '#e8e382') + '<div class="big">' + IC.check + '</div>' +
        '<h2>Доступ відкрито</h2><p>Біля кожної пари є кнопки Zoom, Meet і Classroom.</p></section>' +
        '<div class="step"><i>!</i><div>Не пересилайте посилання на пари<small>Запрошувати інших може лише власник розкладу</small></div></div>' +
        '<button class="btn text" id="offBtn">Сховати посилання на цьому телефоні</button>');
      document.getElementById('offBtn').onclick = function () { revoke(); haptic('n', 'warning'); closePage(); toast('Посилання сховано'); };
      return;
    }
    if (state.vault) {
      showPage(pageTop('Посилання на пари') +
        '<section class="hero green ac-hero">' + deco('#f5a48c', '#e8e382') + '<div class="big">' + IC.check + '</div>' +
        '<h2>Ви власник</h2><p>Тільки ви можете давати доступ. Ті, кого ви запросите, далі нікого запросити не зможуть.</p></section>' +
        '<div class="sec"><b>Як дати доступ</b></div>' +
        '<div class="step"><i>1</i><div>Натисніть «Надіслати запрошення»<small>Відкриється список ваших чатів у Telegram</small></div></div>' +
        '<div class="step"><i>2</i><div>Виберіть людину й надішліть<small>Вона натисне на посилання — і одразу бачить Zoom і Meet</small></div></div>' +
        '<button class="btn dark" id="inviteBtn">' + IC.share + 'Надіслати запрошення</button>' +
        '<div class="note">Надсилайте особисто тим, кому довіряєте. Не кидайте в загальні чати.</div>' +
        '<button class="btn text" id="offBtn">Сховати посилання на цьому телефоні</button>');
      document.getElementById('inviteBtn').onclick = shareInvite;
      document.getElementById('offBtn').onclick = function () { revoke(); haptic('n', 'warning'); closePage(); toast('Посилання сховано'); };
      return;
    }
    showPage(pageTop('Посилання на пари') +
      '<section class="hero salmon ac-hero">' + deco('#e8e382', '#8dca8e') + '<div class="big">' + IC.lock + '</div>' +
      '<h2>Zoom і Meet — лише для запрошених</h2><p>Кнопки входу на пари бачать тільки ті, кому власник розкладу надіслав запрошення.</p></section>' +
      '<div class="sec"><b>Як отримати доступ</b></div>' +
      '<div class="step"><i>1</i><div>Попросіть запрошення у власника розкладу<small>Він надішле вам посилання в Telegram</small></div></div>' +
      '<div class="step"><i>2</i><div>Натисніть на це посилання<small>Розклад відкриється вже з кнопками Zoom і Meet. Більше нічого робити не треба</small></div></div>');
  }

  function setTabs() {
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === state.view);
    });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-li]');
    if (b && LINKS[+b.getAttribute('data-li')]) openLink(LINKS[+b.getAttribute('data-li')].url);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-v');
      if (v === state.view) return;
      haptic('sel'); state.view = v; state.weekShift = 0; setTabs(); render();
    };
  });
  document.getElementById('grpBtn').onclick = openGroupPicker;
  document.getElementById('lockBtn').onclick = openAccess;

  var user = inTg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.first_name) document.getElementById('hi').innerHTML = 'Привіт, <b>' + esc(user.first_name) + '</b> 👋';

  updateLock();
  load();
  restoreAccess();
  setInterval(function () { if (state.view !== 'week') render(); }, 30000);
})();
</script>
</body>
</html>
