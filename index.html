<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Розклад КПІ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    var dark = tg && tg.initData ? tg.colorScheme === 'dark'
      : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --bg: #ececea; --card: #ffffff; --ink: #0d0d0d; --muted: #5a5a5a; --dim: #9b9b98; --line: rgba(13, 13, 13, .12);
    --on: #0d0d0d; --neon: #3ddc6e; --live: #f24b35;
    --c-green: #1db45a; --c-lime: #dcf244; --c-lilac: #d8bbf6; --c-mint: #4ee3b4;
    --c-pink: #f6a4a4; --c-violet: #8b86fa; --c-warm: #cdc7c0; --c-red: #f24b35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #161616; --ink: #ffffff; --muted: #b0b0ad; --dim: #6c6c6a; --line: rgba(255, 255, 255, .14);
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.3 "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 0 16px calc(104px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:active { transform: scale(.97); }
  svg { display: block; }
  .num-font { font-family: Unbounded, "Inter Tight", sans-serif; }

  /* ---- шапка ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 0 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px;
    border: 1.5px solid var(--ink); font-size: 15px; font-weight: 700; }
  .pill svg { width: 14px; height: 14px; }
  .wkpill { font-size: 14px; font-style: italic; font-weight: 600; color: var(--muted); }
  h1 { font-size: 42px; line-height: .98; font-weight: 800; letter-spacing: -.035em; margin: 22px 0 0; }
  h1 span { display: block; color: var(--dim); }
  .hello { font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 10px; }

  /* ---- велика картка (як у Music OS) ---- */
  .hero { background: var(--card); border-radius: 30px; padding: 16px; margin-top: 22px; box-shadow: var(--shadow); }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 4px 14px; }
  .kick { font-size: 19px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .kick span { display: block; color: var(--dim); }
  .ring { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242, 75, 53, .5); } 75%, 100% { box-shadow: 0 0 0 9px rgba(242, 75, 53, 0); } }
  .block { position: relative; border-radius: 22px; padding: 18px 18px 14px; color: var(--on); min-height: 250px; display: flex; flex-direction: column; }
  .block h2 { font-size: 25px; line-height: 1.06; font-weight: 800; letter-spacing: -.025em; margin: 0; }
  .block .who { font-size: 14px; font-weight: 600; opacity: .62; margin-top: 6px; }
  .balls { display: flex; gap: 6px; margin-top: 14px; }
  .ball { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 800;
    border: 2px solid rgba(13, 13, 13, .85); color: var(--on); }
  .big { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; padding-top: 18px; }
  .big svg { width: 74px; height: 74px; }
  .big b { font-family: Unbounded, "Inter Tight", sans-serif; font-size: 92px; line-height: .78; font-weight: 700; letter-spacing: -.04em; }
  .stats { display: flex; margin: 16px 0 2px; }
  .stats div { flex: 1; padding: 0 12px; border-left: 1px solid var(--line); }
  .stats div:first-child { padding-left: 4px; border-left: 0; }
  .stats i { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
  .stats b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .join { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 60px; margin-top: 14px;
    padding: 0 8px 0 22px; border-radius: 30px; background: var(--ink); color: var(--bg); font-size: 17px; font-weight: 700; }
  .join + .join { margin-top: 8px; }
  .join .gdot { width: 9px; height: 9px; border-radius: 50%; background: var(--neon); display: inline-block; margin-right: 10px; vertical-align: 1px; }
  .join b { width: 44px; height: 44px; border-radius: 50%; background: var(--neon); color: #0d0d0d; display: grid; place-items: center; }
  .join b svg { width: 20px; height: 20px; }

  /* ---- список пар ---- */
  .sec { display: flex; justify-content: space-between; align-items: flex-end; margin: 34px 4px 12px; }
  .sec h3 { font-size: 27px; line-height: 1; font-weight: 800; letter-spacing: -.03em; margin: 0; }
  .sec h3 span { color: var(--dim); }
  .sec small { font-size: 14px; font-weight: 600; font-style: italic; color: var(--muted); }
  .row { display: flex; gap: 14px; background: var(--card); border-radius: 24px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .row.live { box-shadow: inset 0 0 0 2.5px var(--ink), var(--shadow); }
  .row.past { opacity: .45; }
  .tile { flex: none; width: 74px; min-height: 74px; border-radius: 18px; color: var(--on); display: flex; flex-direction: column;
    align-items: center; justify-content: center; align-self: flex-start; font-variant-numeric: tabular-nums; }
  .tile b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .tile span { font-size: 13px; font-weight: 700; opacity: .6; }
  .info { flex: 1; min-width: 0; padding: 4px 4px 4px 0; }
  .nm { font-size: 17px; line-height: 1.16; font-weight: 800; letter-spacing: -.015em; }
  .who2 { font-size: 14.5px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .tags { font-size: 13.5px; font-style: italic; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .tags .now { color: var(--live); font-style: normal; font-weight: 800; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .lk { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px;
    background: var(--ink); color: var(--bg); font-size: 14.5px; font-weight: 700; }
  .lk svg { width: 14px; height: 14px; }
  .lk.out { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .empty { background: var(--card); border-radius: 24px; padding: 28px 20px; box-shadow: var(--shadow); }
  .empty b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .empty span { display: block; font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .err { color: var(--live); }

  /* ---- тиждень ---- */
  .wk { display: flex; gap: 8px; margin-top: 18px; }
  .wk button { height: 40px; padding: 0 18px; border-radius: 20px; font-size: 15px; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .wk button.on { background: var(--ink); color: var(--bg); }
  .day { display: flex; align-items: baseline; gap: 10px; margin: 30px 4px 12px; }
  .day b { font-family: Unbounded, "Inter Tight", sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
  .day span { font-size: 15px; font-weight: 600; color: var(--muted); }
  .day em { margin-left: auto; font-size: 12px; font-weight: 800; font-style: normal; background: var(--live); color: #fff; padding: 4px 10px; border-radius: 12px; }

  /* ---- нижня панель ---- */
  .dock { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom));
    width: calc(100% - 24px); max-width: 536px; height: 70px; border-radius: 26px; background: #141414; display: flex; padding: 0 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
  :root[data-theme="dark"] .dock { background: #1e1e1e; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
  .dock button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    color: #8a8a88; font-size: 12px; font-weight: 700; }
  .dock button svg { width: 23px; height: 23px; }
  .dock button.on { color: var(--neon); }
  .dock button[hidden] { display: none; }

  /* ---- окремі сторінки ---- */
  .ptop { display: flex; align-items: center; gap: 12px; padding: 16px 0 0; }
  .back { width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); display: grid; place-items: center; }
  .back svg { width: 20px; height: 20px; }
  .lead { font-size: 16px; font-weight: 600; color: var(--muted); margin: 12px 2px 0; line-height: 1.4; }
  .field { display: flex; gap: 8px; margin-top: 22px; }
  .inp { flex: 1; min-width: 0; display: flex; align-items: center; height: 56px; padding: 0 16px; border-radius: 28px; background: var(--card);
    box-shadow: var(--shadow), inset 0 0 0 1.5px var(--line); }
  .inp b { font-size: 18px; font-weight: 800; color: var(--dim); margin-right: 2px; }
  .inp input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink); }
  .inp input::placeholder { color: var(--dim); font-weight: 600; }
  .add { flex: none; height: 56px; padding: 0 22px; border-radius: 28px; background: var(--neon); color: #0d0d0d; font-size: 16px; font-weight: 800; }
  .add:disabled { opacity: .5; }
  .msg { min-height: 20px; font-size: 14px; font-weight: 700; margin: 8px 6px 0; }
  .msg.bad { color: var(--live); }
  .person { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 20px; padding: 10px 10px 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .ava { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 800; color: var(--on);
    border: 2px solid rgba(13, 13, 13, .85); }
  .person .u { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .u small { display: block; font-size: 13px; font-weight: 600; font-style: italic; color: var(--muted); }
  .del { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; font-weight: 700; color: var(--muted); }
  .note { background: var(--card); border-radius: 22px; padding: 16px 18px; margin-top: 18px; font-size: 14.5px; font-weight: 600; color: var(--muted); line-height: 1.45; box-shadow: var(--shadow); }
  .note b { color: var(--ink); }
  .search { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 18px; border-radius: 28px; background: var(--card); margin: 20px 0 12px;
    box-shadow: var(--shadow), inset 0 0 0 1.5px var(--line); }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); }
  .glist button { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border-radius: 20px; padding: 15px 18px; margin-bottom: 8px; font-size: 17px; font-weight: 800; box-shadow: var(--shadow); }
  .glist small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .hint { color: var(--muted); font-weight: 600; padding: 12px 4px; }

  .toast { position: fixed; left: 50%; top: 12px; z-index: 30; transform: translate(-50%, -150%); width: max-content; max-width: calc(100% - 32px);
    background: var(--ink); color: var(--bg); padding: 13px 20px; border-radius: 24px; font-size: 15px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .2); transition: transform .35s cubic-bezier(.2, .8, .2, 1); text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  .foot { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 30px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <button class="pill" id="grpBtn"><span id="grpName">ГС-61мп</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="wkpill" id="wkName"></span>
  </div>
  <h1 id="title">Розклад<span>КПІ</span></h1>
  <div class="hello" id="hello"></div>
  <main id="main"></main>
  <div class="foot">Дані: <a href="https://schedule.kpi.ua" target="_blank" rel="noopener">schedule.kpi.ua</a></div>
</div>
<div id="page" hidden></div>

<nav class="dock" id="dock">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Сьогодні</button>
  <button data-v="tomorrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>Завтра</button>
  <button data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Тиждень</button>
  <button data-v="access" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M18 8v6M15 11h6"/></svg>Доступ</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function () {
  var API = 'https://api.campus.kpi.ua';
  // Сервер посилань (Cloudflare). Посилання й список доступу живуть там, не в цьому файлі.
  var LINKS_API = 'https://rozklad.zhelieznyi-vladyslav-hs-61mp.workers.dev';
  var DEFAULT_GROUP = { id: '6202', name: 'ГС-61мп' };
  var TZ = 'Europe/Kyiv';
  var DAYS = ['Пн', 'Вв', 'Ср', 'Чт', 'Пт', 'Сб'];
  var DAY_FULL = ['Понеділок', 'Вівторок', 'Середа', 'Четвер', "П'ятниця", 'Субота', 'Неділя'];
  var MONTHS = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  // Стандартний дзвінковий розклад КПІ
  var BELLS = { '08:30': ['10:05', 1], '10:25': ['12:00', 2], '12:20': ['13:55', 3], '14:15': ['15:50', 4],
                '16:10': ['17:45', 5], '18:30': ['20:05', 6], '20:20': ['21:55', 7] };
  var PALETTE = ['green', 'lilac', 'lime', 'mint', 'violet', 'pink', 'warm', 'red'];
  var KIND = { zoom: 'Zoom', meet: 'Meet', classroom: 'Classroom' };
  var IC = {
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    right: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter"><path d="M6 40h62M42 14l26 26-26 26"/></svg>',
    down: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter"><path d="M40 4v66M14 44l26 26 26-26"/></svg>',
    left: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter"><path d="M74 40H12M38 14L12 40l26 26"/></svg>'
  };

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  var root = document.documentElement;

  function applyTheme() {
    var dark = inTg ? tg.colorScheme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (inTg) {
      var c = dark ? '#000000' : '#ececea';
      try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
    }
  }
  if (inTg) {
    try { tg.ready(); tg.expand(); tg.onEvent('themeChanged', applyTheme); } catch (e) {}
  }
  applyTheme();

  function haptic(kind, arg) {
    if (!inTg || !tg.HapticFeedback) return;
    try {
      if (kind === 'sel') tg.HapticFeedback.selectionChanged();
      else if (kind === 'imp') tg.HapticFeedback.impactOccurred(arg || 'light');
      else tg.HapticFeedback.notificationOccurred(arg);
    } catch (e) {}
  }
  var toastTimer;
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  var state = { view: 'today', weekShift: 0, data: null, currentWeek: null, refDate: null, baseDate: null,
                group: loadGroup(), links: null, owner: false, colors: {} };
  var LINKS = [];

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function loadGroup() {
    try { var g = JSON.parse(read('rozklad_group')); if (g && g.id) return g; } catch (e) {}
    return DEFAULT_GROUP;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---- дата/час у київському часовому поясі ----
  function kyivNow() {
    var p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date())
      .forEach(function (x) { p[x.type] = x.value; });
    return { y: +p.year, m: +p.month, d: +p.day, min: (+p.hour % 24) * 60 + (+p.minute) };
  }
  function dateUTC(y, m, d) { return new Date(Date.UTC(y, m - 1, d)); }
  function addDays(dt, n) { return new Date(dt.getTime() + n * 86400000); }
  function iso(dt) { return dt.toISOString().slice(0, 10); }
  function dow(dt) { return (dt.getUTCDay() + 6) % 7; } // 0 = Пн … 6 = Нд
  function monday(dt) { return addDays(dt, -dow(dt)); }
  function human(dt) { return dt.getUTCDate() + ' ' + MONTHS[dt.getUTCMonth()]; }
  function toMin(hhmm) { var a = hhmm.split(':'); return +a[0] * 60 + +a[1]; }
  function pairs(n) { var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? 'пара' : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? 'пари' : 'пар'); }

  function weekOf(dt) {
    var diff = Math.round((monday(dt) - monday(state.refDate)) / (7 * 86400000));
    return ((state.currentWeek - 1 + diff) % 2 + 2) % 2 + 1;
  }

  function pairsFor(dt) {
    var d = dow(dt);
    if (d > 5 || !state.data) return [];
    var wk = weekOf(dt) === 1 ? state.data.scheduleFirstWeek : state.data.scheduleSecondWeek;
    var day = (wk || []).filter(function (x) { return x.day === DAYS[d]; })[0];
    if (!day) return [];
    var key = iso(dt);
    return day.pairs.filter(function (p) { return !p.dates || !p.dates.length || p.dates.indexOf(key) >= 0; })
      .map(function (p) {
        var s = p.time.slice(0, 5), b = BELLS[s];
        var e = b ? b[0] : (function () { var m = toMin(s) + 95; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); })();
        return { start: s, end: e, num: b ? b[1] : '', name: p.name, type: p.type, tag: p.tag,
                 teacher: p.lecturer && p.lecturer.name, place: p.location, dates: p.dates || [] };
      })
      .sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
  }

  // У кожного предмета свій колір — однаковий у картці й у списку
  function buildColors() {
    var names = {};
    ['scheduleFirstWeek', 'scheduleSecondWeek'].forEach(function (w) {
      (state.data[w] || []).forEach(function (d) { d.pairs.forEach(function (p) { names[p.name] = 1; }); });
    });
    state.colors = {};
    Object.keys(names).sort().forEach(function (n, i) { state.colors[n] = PALETTE[i % PALETTE.length]; });
  }
  function colorOf(name) { return 'var(--c-' + (state.colors[name] || 'warm') + ')'; }

  // ---- посилання (приходять із сервера лише тим, кому дали доступ) ----
  function linksFor(name) {
    if (!state.links || state.group.id !== state.links.group) return [];
    var n = String(name || '').toLowerCase(), out = [];
    state.links.items.forEach(function (it) {
      if (n.indexOf(it.match.toLowerCase()) >= 0) out = out.concat(it.links);
    });
    return out;
  }
  function linkRef(l) { LINKS.push(l); return LINKS.length - 1; }
  function openLink(url) {
    haptic('imp', 'light');
    if (inTg) { try { tg.openLink(url); return; } catch (e) {} }
    window.open(url, '_blank', 'noopener');
  }
  function post(path, body) {
    body = body || {};
    body.initData = tg.initData;
    return fetch(LINKS_API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function loadAccess() {
    if (!inTg) return;
    try {
      var c = JSON.parse(read('rozklad_links'));
      if (c) { state.links = c.links; state.owner = !!c.owner; updateDock(); }
    } catch (e) {}
    post('/links').then(function (r) {
      if (r._status !== 200) return;
      state.links = r.links || null; state.owner = !!r.owner;
      if (state.links || state.owner) store('rozklad_links', JSON.stringify({ links: state.links, owner: state.owner }));
      else drop('rozklad_links');
      updateDock(); render();
    }).catch(function () {});
  }

  // ---- розмітка ----
  function shortName(n) {
    var p = String(n || '').trim().split(/\s+/);
    if (p.length < 2) return n || '';
    return p[0] + ' ' + p.slice(1, 3).map(function (x) { return x.charAt(0) + '.'; }).join(' ');
  }
  function typeOf(p) { return p.tag === 'lec' ? 'лекція' : p.tag === 'lab' ? 'лаба' : 'практика'; }
  function dur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return h ? h + ' год' + (m ? ' ' + m + ' хв' : '') : m + ' хв';
  }

  function rowHtml(p, opts) {
    opts = opts || {};
    var cls = 'row' + (opts.live ? ' live' : '') + (opts.past ? ' past' : '');
    var tags = (opts.live ? '<span class="now">● зараз</span> · ' : '') + '#' + typeOf(p) + (p.num ? ' · ' + p.num + ' пара' : '');
    if (opts.showDates && p.dates.length) tags += ' · лише ' + p.dates.map(function (x) { return x.slice(8, 10) + '.' + x.slice(5, 7); }).join(', ');
    var ls = opts.past ? [] : linksFor(p.name);
    var links = ls.length ? '<div class="links">' + ls.map(function (l) {
      return '<button class="lk' + (l.kind === 'classroom' ? ' out' : '') + '" data-li="' + linkRef(l) + '">' + esc(KIND[l.kind] || l.kind) + IC.out + '</button>';
    }).join('') + '</div>' : '';
    return '<div class="' + cls + '"><div class="tile" style="background:' + colorOf(p.name) + '"><b>' + p.start + '</b><span>' + p.end + '</span></div>' +
      '<div class="info"><div class="nm">' + esc(p.name) + '</div><div class="who2">' + esc(shortName(p.teacher)) + (p.place ? ' · ' + esc(p.place) : '') + '</div>' +
      '<div class="tags">' + tags + '</div>' + links + '</div></div>';
  }

  function nextDayWithPairs(from) {
    for (var i = 1; i <= 14; i++) { var d = addDays(from, i); if (pairsFor(d).length) return d; }
    return null;
  }

  function joinButtons(p, verb) {
    return linksFor(p.name).filter(function (l) { return l.kind !== 'classroom'; }).map(function (l) {
      return '<button class="join" data-li="' + linkRef(l) + '"><span><i class="gdot"></i>' + verb + ' ' + esc(KIND[l.kind] || l.kind) + '</span><b>' + IC.out + '</b></button>';
    }).join('');
  }

  function heroHtml(dt, list, now) {
    var live = null, next = null;
    list.forEach(function (p) {
      if (now.min >= toMin(p.start) && now.min < toMin(p.end)) live = p;
      else if (!next && toMin(p.start) > now.min) next = p;
    });
    function card(p, kick, sub, ring, arrow, stats, verb) {
      return '<section class="hero"><div class="hero-top"><div class="kick">' + kick + '<span>' + sub + '</span></div>' +
        (ring ? '<div class="ring">' + ring + '</div>' : '') + '</div>' +
        '<div class="block" style="background:' + colorOf(p.name) + '"><h2>' + esc(p.name) + '</h2>' +
        '<div class="who">' + esc(shortName(p.teacher)) + ' · ' + typeOf(p) + '</div>' +
        '<div class="big">' + arrow + '<b>' + (p.num || p.start.slice(0, 2)) + '</b></div></div>' +
        '<div class="stats">' + stats + '</div>' + (verb ? joinButtons(p, verb) : '') + '</section>';
    }
    function stat(label, value) { return '<div><i>' + label + '</i><b>' + value + '</b></div>'; }
    if (live) {
      return card(live, 'Зараз іде', 'ще ' + dur(toMin(live.end) - now.min), '<span class="dot"></span>', IC.right,
        stat('Початок', live.start) + stat('Кінець', live.end) + stat('Далі', next ? next.start : '—'), 'Увійти в');
    }
    if (next) {
      var wait = toMin(next.start) - now.min;
      return card(next, 'Наступна пара', 'через ' + dur(wait), '', IC.down,
        stat('Початок', next.start) + stat('Кінець', next.end) + stat('Пара', next.num || '—'), wait <= 30 ? 'Увійти в' : '');
    }
    var nd = nextDayWithPairs(dt), np = nd && pairsFor(nd)[0];
    if (!np) return '';
    return card(np, list.length ? 'На сьогодні все' : 'Сьогодні пар немає', 'наступна — ' + DAY_FULL[dow(nd)].toLowerCase(), '', IC.left,
      stat('Коли', human(nd)) + stat('Початок', np.start) + stat('Пара', np.num || '—'), '');
  }

  function dayList(list, opts) {
    var now = kyivNow(), html = '';
    if (!list.length) return '<div class="empty"><b>Пар немає</b><span>Можна відпочити</span></div>';
    list.forEach(function (p) {
      var o = { showDates: opts.showDates };
      if (opts.today) { o.live = now.min >= toMin(p.start) && now.min < toMin(p.end); o.past = now.min >= toMin(p.end); }
      html += rowHtml(p, o);
    });
    return html;
  }

  function render() {
    if (!state.data || !document.getElementById('page').hidden) return;
    LINKS = [];
    var n = kyivNow(), main = document.getElementById('main');
    var today = state.baseDate = dateUTC(n.y, n.m, n.d), tomorrow = addDays(today, 1);
    var title = document.getElementById('title'), html = '';
    document.getElementById('grpName').textContent = state.group.name;
    document.getElementById('wkName').textContent = weekOf(today) + '-й тиждень';

    if (state.view === 'today') {
      var list = pairsFor(today);
      title.innerHTML = DAY_FULL[dow(today)] + '<span>' + human(today) + '</span>';
      html += heroHtml(today, list, n);
      if (list.length) {
        html += '<div class="sec"><h3>Пари<br><span>на сьогодні</span></h3><small>' + pairs(list.length) + '</small></div>';
        html += dayList(list, { today: true });
      }
    } else if (state.view === 'tomorrow') {
      var tl = pairsFor(tomorrow);
      title.innerHTML = 'Завтра<span>' + DAY_FULL[dow(tomorrow)].toLowerCase() + ', ' + human(tomorrow) + '</span>';
      html += '<div class="sec"><h3>Пари<br><span>на завтра</span></h3><small>' + (tl.length ? pairs(tl.length) : 'вихідний') + '</small></div>';
      html += dayList(tl, {});
    } else {
      var mon = addDays(monday(today), 7 * state.weekShift);
      title.innerHTML = (state.weekShift ? 'Наступний' : 'Цей') + '<span>тиждень</span>';
      html += '<div class="wk"><button data-w="0" class="' + (state.weekShift === 0 ? 'on' : '') + '">Цей</button>' +
        '<button data-w="1" class="' + (state.weekShift === 1 ? 'on' : '') + '">Наступний</button></div>';
      html += '<div class="hello">' + human(mon) + ' – ' + human(addDays(mon, 5)) + ' · ' + weekOf(mon) + '-й тиждень</div>';
      var any = false;
      for (var i = 0; i < 6; i++) {
        var d = addDays(mon, i), dl = pairsFor(d);
        if (!dl.length) continue;
        any = true;
        html += '<div class="day"><b>' + DAYS[i].replace('Вв', 'Вт') + '</b><span>' + DAY_FULL[i].toLowerCase() + ', ' + human(d) + '</span>' +
          (iso(d) === iso(today) ? '<em>сьогодні</em>' : '') + '</div>';
        html += dayList(dl, { showDates: true });
      }
      if (!any) html += '<div class="empty" style="margin-top:18px"><b>Пар немає</b><span>Цього тижня вільно</span></div>';
    }
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('[data-w]'), function (b) {
      b.onclick = function () {
        var w = +b.getAttribute('data-w');
        if (w === state.weekShift) return;
        haptic('sel'); state.weekShift = w; render();
      };
    });
  }

  function getJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function load() {
    var gid = state.group.id;
    var cached = read('rozklad_cache_' + gid);
    if (cached) {
      try {
        var c = JSON.parse(cached);
        if (c.ref) { state.data = c.data; state.currentWeek = c.week; state.refDate = new Date(c.ref + 'T00:00:00Z'); buildColors(); render(); }
      } catch (e) {}
    }
    Promise.all([getJSON(API + '/schedule/lessons?groupId=' + encodeURIComponent(gid)), getJSON(API + '/time/current')])
      .then(function (r) {
        state.data = r[0];
        state.currentWeek = r[1].currentWeek;
        var n = kyivNow(); state.refDate = dateUTC(n.y, n.m, n.d);
        store('rozklad_cache_' + gid, JSON.stringify({ data: state.data, week: state.currentWeek, ref: iso(state.refDate) }));
        buildColors(); render();
      })
      .catch(function () {
        if (!state.data) {
          document.getElementById('main').innerHTML = '<div class="empty err" style="margin-top:22px"><b>Немає зв’язку</b><span>Не вдалося завантажити розклад. Перевірте інтернет і відкрийте ще раз.</span></div>';
        }
      });
  }

  // ---- окремі сторінки ----
  var pageView = null;
  function showPage(html, view) {
    var page = document.getElementById('page');
    page.innerHTML = html; page.hidden = false; pageView = view || null;
    document.getElementById('home').hidden = true;
    window.scrollTo(0, 0);
    if (inTg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    var b = page.querySelector('.back');
    if (b) b.onclick = closePage;
    setDock(view || state.view);
  }
  function closePage() {
    var page = document.getElementById('page');
    if (page.hidden) return;
    page.hidden = true; page.innerHTML = ''; pageView = null;
    document.getElementById('home').hidden = false;
    if (inTg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
    setDock(state.view);
    render();
  }
  if (inTg && tg.BackButton) { try { tg.BackButton.onClick(closePage); } catch (e) {} }
  function ptop(a, b) { return '<div class="ptop"><button class="back" aria-label="Назад">' + IC.back + '</button></div><h1>' + a + '<span>' + b + '</span></h1>'; }

  var groupsCache = null;
  function openGroupPicker() {
    showPage(ptop('Вибір', 'групи') + '<label class="search">' + IC.search +
      '<input id="q" placeholder="Напр. ГС-61мп" autocomplete="off"></label>' +
      '<div class="glist" id="gl"><div class="hint">Завантаження списку груп…</div></div>', 'group');
    var q = document.getElementById('q'), gl = document.getElementById('gl');
    function draw() {
      if (!groupsCache) return;
      var s = q.value.trim().toLowerCase();
      var list = groupsCache.filter(function (g) { return !s || g.name.toLowerCase().indexOf(s) >= 0; }).slice(0, 40);
      gl.innerHTML = list.map(function (g) {
        return '<button data-id="' + g.id + '" data-name="' + esc(g.name) + '"><span>' + esc(g.name) + '</span><small>' + esc(g.faculty || '') + '</small></button>';
      }).join('') || '<div class="hint">Нічого не знайдено</div>';
      Array.prototype.forEach.call(gl.querySelectorAll('button'), function (b) {
        b.onclick = function () {
          haptic('sel');
          state.group = { id: b.getAttribute('data-id'), name: b.getAttribute('data-name') };
          store('rozklad_group', JSON.stringify(state.group));
          state.data = null; state.view = 'today'; closePage(); load();
        };
      });
    }
    q.oninput = draw;
    if (groupsCache) draw();
    else getJSON(API + '/schedule/groups').then(function (g) { groupsCache = g.data || g; draw(); })
      .catch(function () { gl.innerHTML = '<div class="hint err">Не вдалося завантажити список груп</div>'; });
  }

  // ---- вкладка «Доступ» (лише для власника) ----
  function openAccess() {
    showPage(ptop('Доступ', 'до посилань') +
      '<div class="lead">Впишіть нікнейм людини в Telegram і натисніть «Додати». Вона побачить кнопки Zoom, Meet і Classroom, щойно відкриє бота.</div>' +
      '<div class="field"><label class="inp"><b>@</b><input id="nick" placeholder="nickname" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40"></label>' +
      '<button class="add" id="addBtn">Додати</button></div><div class="msg" id="msg"></div>' +
      '<div class="sec" style="margin-top:22px"><h3>Мають<br><span>доступ</span></h3><small id="cnt"></small></div>' +
      '<div id="people"><div class="hint">Завантаження…</div></div>' +
      '<div class="note"><b>Де людині взяти нікнейм:</b> Telegram → Налаштування → Ім’я користувача. Якщо його немає — нехай створить, інакше додати не вийде.<br><br>' +
      '<b>Щоб забрати доступ</b> — натисніть «Прибрати». Посилання зникнуть у людини, коли вона наступного разу відкриє бота.</div>', 'access');
    var nick = document.getElementById('nick'), msg = document.getElementById('msg'), addBtn = document.getElementById('addBtn');
    function say(text, bad) { msg.textContent = text; msg.className = 'msg' + (bad ? ' bad' : ''); }
    function draw(r) {
      var people = document.getElementById('people');
      if (!people) return;
      var me = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username || '').toLowerCase();
      var all = (r.owners || []).map(function (u) { return { u: u, owner: true }; })
        .concat((r.allow || []).filter(function (u) { return (r.owners || []).indexOf(u) < 0; }).map(function (u) { return { u: u }; }));
      document.getElementById('cnt').textContent = all.length + ' ' + (all.length === 1 ? 'людина' : all.length < 5 ? 'людини' : 'людей');
      people.innerHTML = all.map(function (x, i) {
        return '<div class="person"><span class="ava" style="background:var(--c-' + PALETTE[i % PALETTE.length] + ')">' + esc(x.u.charAt(0).toUpperCase()) + '</span>' +
          '<div class="u">@' + esc(x.u) + '<small>' + (x.owner ? (x.u === me ? 'ви — власник' : 'власник') : 'бачить посилання') + '</small></div>' +
          (x.owner ? '' : '<button class="del" data-u="' + esc(x.u) + '">Прибрати</button>') + '</div>';
      }).join('');
      Array.prototype.forEach.call(people.querySelectorAll('[data-u]'), function (b) {
        b.onclick = function () {
          var u = b.getAttribute('data-u');
          b.disabled = true; b.textContent = '…';
          post('/access/remove', { username: u }).then(function (r) {
            if (r._status !== 200) throw new Error();
            haptic('n', 'warning'); say('@' + u + ' більше не бачить посилань'); draw(r);
          }).catch(function () { say('Не вдалося. Перевірте інтернет', true); b.disabled = false; b.textContent = 'Прибрати'; });
        };
      });
    }
    function add() {
      var u = nick.value.trim().replace(/^https?:\/\//i, '').replace(/^t\.me\//i, '').replace(/^@/, '');
      if (!/^[A-Za-z0-9_]{4,32}$/.test(u)) { say('Нікнейм — це латинські літери, цифри й _, без пробілів', true); haptic('n', 'error'); return; }
      addBtn.disabled = true; say('');
      post('/access/add', { username: u }).then(function (r) {
        if (r._status !== 200) throw new Error();
        haptic('n', 'success'); nick.value = ''; say('Готово! @' + u.toLowerCase() + ' тепер бачить посилання'); draw(r);
      }).catch(function () { say('Не вдалося додати. Перевірте інтернет', true); haptic('n', 'error'); })
        .then(function () { addBtn.disabled = false; });
    }
    addBtn.onclick = add;
    nick.onkeydown = function (e) { if (e.key === 'Enter') add(); };
    post('/access/list').then(function (r) {
      if (r._status !== 200) throw new Error();
      draw(r);
    }).catch(function () { var p = document.getElementById('people'); if (p) p.innerHTML = '<div class="hint err">Не вдалося завантажити список. Перевірте інтернет</div>'; });
  }

  // ---- нижня панель ----
  function setDock(v) {
    Array.prototype.forEach.call(document.querySelectorAll('#dock button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
  }
  function updateDock() { document.querySelector('#dock [data-v="access"]').hidden = !state.owner; }
  Array.prototype.forEach.call(document.querySelectorAll('#dock button'), function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-v');
      haptic('sel');
      if (v === 'access') { if (pageView !== 'access') openAccess(); return; }
      if (pageView) closePage();
      if (v === state.view) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      state.view = v; state.weekShift = 0; setDock(v); render(); window.scrollTo(0, 0);
    };
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-li]');
    if (b && LINKS[+b.getAttribute('data-li')]) openLink(LINKS[+b.getAttribute('data-li')].url);
  });
  document.getElementById('grpBtn').onclick = openGroupPicker;

  var user = inTg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.first_name) document.getElementById('hello').textContent = 'Привіт, ' + user.first_name + ' 👋';

  load();
  loadAccess();
  setInterval(function () { if (state.view !== 'week') render(); }, 30000);
})();
</script>
</body>
</html>
