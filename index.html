<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Розклад КПІ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    var dark = tg && tg.initData ? tg.colorScheme === 'dark'
      : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --material: rgba(242, 242, 247, .82);
    --label: #000000; --label2: rgba(60, 60, 67, .6); --label3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .2); --fill: rgba(118, 118, 128, .12); --thumb: #ffffff;
    --blue: #007aff; --blue-t: rgba(0, 122, 255, .1);
    --green: #248a3d; --green-t: rgba(52, 199, 89, .14);
    --orange: #c93400; --orange-t: rgba(255, 149, 0, .14);
    --red: #ff3b30; --red-t: rgba(255, 59, 48, .07);
    --shadow: 0 1px 1px rgba(0, 0, 0, .02), 0 6px 20px rgba(0, 0, 0, .04);
    --thumb-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --material: rgba(0, 0, 0, .75);
    --label: #ffffff; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(118, 118, 128, .24); --thumb: #636366;
    --blue: #0a84ff; --blue-t: rgba(10, 132, 255, .18);
    --green: #30d158; --green-t: rgba(48, 209, 88, .16);
    --orange: #ff9f0a; --orange-t: rgba(255, 159, 10, .16);
    --red: #ff453a; --red-t: rgba(255, 69, 58, .12);
    --shadow: none; --thumb-shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--label);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 0 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  /* ---- шапка ---- */
  header { padding: 14px 4px 6px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .grp { flex: none; font-size: 15px; font-weight: 500; color: var(--blue); background: var(--card);
    padding: 6px 13px; border-radius: 16px; box-shadow: var(--shadow); white-space: nowrap; }
  .grp:active { opacity: .6; }
  h1 { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; margin: 0;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- перемикач як в iOS ---- */
  .bar { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px;
    background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .seg { position: relative; display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1; position: relative; z-index: 1; padding: 7px 0; font-size: 14px; font-weight: 500;
    border-radius: 8px; transition: font-weight .2s; }
  .seg button.on { font-weight: 600; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 8px; background: var(--thumb);
    box-shadow: var(--thumb-shadow); transition: transform .32s cubic-bezier(.3, .8, .25, 1); }

  /* ---- головна картка ---- */
  .hero { background: var(--card); border-radius: 22px; padding: 16px 18px 18px; margin: 10px 0 4px; box-shadow: var(--shadow); }
  .kicker { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--label2); }
  .hero.live .kicker { color: var(--red); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, .45); } 70%, 100% { box-shadow: 0 0 0 7px rgba(255, 59, 48, 0); } }
  .hero h2 { font-size: 22px; line-height: 1.22; font-weight: 700; letter-spacing: -.015em; margin: 6px 0 4px; }
  .hero .meta { font-size: 14px; color: var(--label2); }
  .progress { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; margin: 16px 0 8px; }
  .progress i { display: block; height: 100%; border-radius: 3px; background: var(--red); }
  .stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--label); font-weight: 600; }
  .join { display: flex; gap: 8px; margin-top: 16px; }
  .join button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px;
    border-radius: 14px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 600; transition: transform .15s, opacity .15s; }
  .join button:active { transform: scale(.97); opacity: .85; }
  .join svg { width: 20px; height: 20px; }

  /* ---- список пар ---- */
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 4px 8px; }
  .sec b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sec span { font-size: 13px; color: var(--label2); }
  .sec.today b { color: var(--blue); }
  .range { font-size: 13px; color: var(--label2); margin: 12px 4px 0; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { position: relative; display: flex; gap: 14px; padding: 13px 16px 14px; }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 82px; right: 0; height: 1px;
    background: var(--sep); transform: scaleY(.5); transform-origin: top; }
  .row.live { background: var(--red-t); }
  .row.past > div { opacity: .4; }
  .time { width: 52px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .time .s { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .time .e { font-size: 13px; color: var(--label2); }
  .time .n { font-size: 11px; color: var(--label3); margin-top: 3px; }
  .row.live .time .s { color: var(--red); }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 600; line-height: 1.28; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 5px; font-size: 13px; color: var(--label2); }
  .tag { font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 6px; letter-spacing: .01em; }
  .tag.lec { color: var(--blue); background: var(--blue-t); }
  .tag.prac { color: var(--green); background: var(--green-t); }
  .tag.lab { color: var(--orange); background: var(--orange-t); }
  .only { font-size: 12px; color: var(--label3); margin-top: 4px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px 0 9px; border-radius: 14px;
    background: var(--blue-t); color: var(--blue); font-size: 13px; font-weight: 600; transition: transform .15s; }
  .chip:active { transform: scale(.95); }
  .chip svg { width: 15px; height: 15px; }
  .empty { text-align: center; color: var(--label2); padding: 22px 16px; font-size: 15px; }
  .err { color: var(--red); padding: 16px; }

  /* ---- вибір групи ---- */
  .search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 10px; margin: 12px 0 10px; }
  .search svg { width: 17px; height: 17px; color: var(--label2); flex: none; }
  .search input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 17px; color: var(--label); padding: 8px 0; }
  .search input::placeholder { color: var(--label2); }
  .glist button { position: relative; display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; }
  .glist button + button::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 1px;
    background: var(--sep); transform: scaleY(.5); transform-origin: top; }
  .glist small { color: var(--label2); font-size: 14px; }
  .hint { color: var(--label2); font-size: 14px; padding: 14px 16px; }

  /* ---- код доступу ---- */
  .foot { text-align: center; color: var(--label3); font-size: 12px; margin-top: 30px; line-height: 2; }
  .foot a, .foot button { color: var(--label3); font-size: 12px; }
  .foot a { text-decoration: none; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start;
    padding: 14vh 20px 0; visibility: hidden; }
  .modal .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); opacity: 0; transition: opacity .25s; }
  .dialog { position: relative; width: 100%; max-width: 360px; background: var(--card); border-radius: 22px; padding: 24px 20px 18px;
    text-align: center; opacity: 0; transform: scale(1.06); transition: opacity .25s, transform .3s cubic-bezier(.2, .8, .2, 1); }
  .modal.open { visibility: visible; }
  .modal.open .scrim { opacity: 1; }
  .modal.open .dialog { opacity: 1; transform: none; }
  .badge-ic { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px; display: grid; place-items: center;
    background: var(--blue-t); color: var(--blue); }
  .badge-ic svg { width: 28px; height: 28px; }
  .dialog h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; }
  .dialog p { font-size: 14px; color: var(--label2); margin: 0 0 18px; }
  .dialog input { width: 100%; height: 50px; border: 0; outline: none; border-radius: 12px; background: var(--fill); color: var(--label);
    font: 600 18px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
  .dialog input::placeholder { color: var(--label3); letter-spacing: .12em; }
  .dialog .msg { min-height: 18px; font-size: 13px; color: var(--red); margin: 8px 0 6px; }
  .btn { display: block; width: 100%; height: 50px; border-radius: 14px; font-size: 17px; font-weight: 600; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.plain { color: var(--blue); height: 44px; margin-top: 4px; font-weight: 400; }
  .btn:disabled { opacity: .5; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="sub">Завантаження…</div>
  <div class="top">
    <h1 id="title">Розклад</h1>
    <button class="grp" id="grpBtn">Змінити групу</button>
  </div>
</header>
<div class="bar">
  <div class="seg" id="tabs">
    <span class="thumb"></span>
    <button data-v="today" class="on">Сьогодні</button>
    <button data-v="tomorrow">Завтра</button>
    <button data-v="week">Тиждень</button>
  </div>
</div>
<main id="main"></main>
<div class="foot">
  <button id="keyBtn">Код доступу</button><br>
  Дані: <a href="https://schedule.kpi.ua" target="_blank" rel="noopener">schedule.kpi.ua</a>
</div>

<div class="modal" id="modal">
  <div class="scrim" id="scrim"></div>
  <div class="dialog" id="dialog">
    <div class="badge-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
    <h3>Посилання на пари</h3>
    <p>Введіть код доступу, щоб бачити Zoom, Meet і Classroom біля кожної пари.</p>
    <input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
    <div class="msg" id="msg"></div>
    <button class="btn primary" id="unlockBtn">Відкрити</button>
    <button class="btn plain" id="cancelBtn">Скасувати</button>
  </div>
</div>

  function applyTheme() {
    var dark = inTg ? tg.colorScheme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;

    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date())
      .forEach(function (x) { p[x.type] = x.value; });
    return { y: +p.year, m: +p.month, d: +p.day, min: (+p.hour % 24) * 60 + (+p.minute) };
  }
  function dateUTC(y, m, d) { return new Date(Date.UTC(y, m - 1, d)); }
  function addDays(dt, n) { return new Date(dt.getTime() + n * 86400000); }
  function iso(dt) { return dt.toISOString().slice(0, 10); }
  function dow(dt) { return (dt.getUTCDay() + 6) % 7; } // 0 = Пн … 6 = Нд
  function monday(dt) { return addDays(dt, -dow(dt)); }
  function human(dt) { return dt.getUTCDate() + ' ' + MONTHS[dt.getUTCMonth()]; }
  function toMin(hhmm) { var a = hhmm.split(':'); return +a[0] * 60 + +a[1]; }

  function weekOf(dt) {
    var diff = Math.round((monday(dt) - monday(state.refDate)) / (7 * 86400000));
    return ((state.currentWeek - 1 + diff) % 2 + 2) % 2 + 1;
  }

  function pairsFor(dt) {
    var d = dow(dt);
    if (d > 5 || !state.data) return [];
    var wk = weekOf(dt) === 1 ? state.data.scheduleFirstWeek : state.data.scheduleSecondWeek;
    var day = (wk || []).filter(function (x) { return x.day === DAYS[d]; })[0];
    if (!day) return [];
    var key = iso(dt);
    return day.pairs.filter(function (p) { return !p.dates || !p.dates.length || p.dates.indexOf(key) >= 0; })
      .map(function (p) {
        var s = p.time.slice(0, 5), b = BELLS[s];
        var e = b ? b[0] : (function () { var m = toMin(s) + 95; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); })();
        return { start: s, end: e, num: b ? b[1] : '', name: p.name, type: p.type, tag: p.tag,
                 teacher: p.lecturer && p.lecturer.name, place: p.location, dates: p.dates || [] };
      })
      .sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
  }

  // ---- посилання ----
  function linksFor(name) {
    if (!state.vault || state.group.id !== state.vault.group) return [];
    var n = String(name || '').toLowerCase(), out = [];
    state.vault.items.forEach(function (it) {
      if (n.indexOf(it.match.toLowerCase()) >= 0) out = out.concat(it.links);
    });
    return out;
  }
  function linkRef(l) { LINKS.push(l); return LINKS.length - 1; }
  function chips(name) {
    var ls = linksFor(name);
    if (!ls.length) return '';
    return '<div class="links">' + ls.map(function (l) {
      var k = KIND[l.kind] || [l.kind, 'video'];
      return '<button class="chip" data-li="' + linkRef(l) + '">' + ICONS[k[1]] + esc(k[0]) + '</button>';
    }).join('') + '</div>';
  }
  function joinButtons(name) {
    var ls = linksFor(name).filter(function (l) { return l.kind !== 'classroom'; });
    if (!ls.length) return '';
    return '<div class="join">' + ls.map(function (l) {
      return '<button data-li="' + linkRef(l) + '">' + ICONS.video + (ls.length > 1 ? '' : 'Приєднатися · ') + esc(KIND[l.kind][0]) + '</button>';
    }).join('') + '</div>';
  }
  function openLink(url) {
    haptic('imp', 'light');
    if (inTg) { try { tg.openLink(url); return; } catch (e) {} }
    window.open(url, '_blank', 'noopener');
  }

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function normCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function decrypt(code) {
    if (!VAULT || !window.crypto || !crypto.subtle) return Promise.reject(new Error('unsupported'));
    var raw = b64(VAULT), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(normCode(code)), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: VAULT_ITER, hash: 'SHA-256' },
          k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function saveCode(c) {
    store(CODE_KEY, c);
    if (inTg && tg.CloudStorage) { try { tg.CloudStorage.setItem(CODE_KEY, c); } catch (e) {} }
  }
  function forgetCode() {
    drop(CODE_KEY);
    if (inTg && tg.CloudStorage) { try { tg.CloudStorage.removeItem(CODE_KEY); } catch (e) {} }
  }
  function restoreAccess() {
    function tryCode(c) {
      if (!c) return;
      decrypt(c).then(function (v) { state.vault = v; store(CODE_KEY, c); updateFoot(); render(); })
        .catch(function () { forgetCode(); });
    }
    var c = read(CODE_KEY);
    if (c) return tryCode(c);
    if (inTg && tg.CloudStorage) {
      try { tg.CloudStorage.getItem(CODE_KEY, function (err, v) { if (!err) tryCode(v); }); } catch (e) {}
    }
  }

  // ---- розмітка ----
  function shortName(n) {
    var p = String(n || '').trim().split(/\s+/);
    if (p.length < 2) return n || '';
    return p[0] + ' ' + p.slice(1, 3).map(function (x) { return x.charAt(0) + '.'; }).join(' ');
  }
  function tagOf(p) {
    if (p.tag === 'lec') return ['lec', 'Лекція'];
    if (p.tag === 'lab') return ['lab', 'Лаба'];
    return ['prac', 'Практика'];
  }
  function metaHtml(p) {
    var t = tagOf(p);
    return '<div class="meta"><span class="tag ' + t[0] + '">' + t[1] + '</span><span>' + esc(shortName(p.teacher)) +
      (p.place ? ' · ' + esc(p.place) : '') + '</span></div>';
  }

  function rowHtml(p, opts) {
    var cls = 'row';
    if (opts && opts.live) cls += ' live';
    if (opts && opts.past) cls += ' past';
    var only = '';
    if (opts && opts.showDates && p.dates.length) {
      only = '<div class="only">лише ' + p.dates.map(function (x) { return x.slice(8, 10) + '.' + x.slice(5, 7); }).join(', ') + '</div>';
    }
    return '<div class="' + cls + '"><div class="time"><div class="s">' + p.start + '</div><div class="e">' + p.end +
      '</div>' + (p.num ? '<div class="n">' + p.num + ' пара</div>' : '') + '</div><div class="info"><div class="name">' +
      esc(p.name) + '</div>' + metaHtml(p) + only + chips(p.name) + '</div></div>';
  }

  function dur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + ' год ' : '') + m + ' хв';
  }

  function nextDayWithPairs(from) {
    for (var i = 1; i <= 14; i++) { var d = addDays(from, i); if (pairsFor(d).length) return d; }
    return null;
  }

  function heroHtml(dt, list, now) {
    var live = null, next = null;
    list.forEach(function (p) {
      if (now.min >= toMin(p.start) && now.min < toMin(p.end)) live = p;
      else if (!next && toMin(p.start) > now.min) next = p;
    });
    if (live) {
      var total = toMin(live.end) - toMin(live.start), done = now.min - toMin(live.start);
      return '<section class="hero live"><div class="kicker"><span class="dot"></span>Зараз іде</div>' +
        '<h2>' + esc(live.name) + '</h2>' + metaHtml(live).replace('class="meta"', 'class="meta" style="margin-top:8px"') +
        '<div class="progress"><i style="width:' + Math.round(done / total * 100) + '%"></i></div>' +
        '<div class="stats"><span>Залишилось <b>' + dur(toMin(live.end) - now.min) + '</b></span><span>' +
        (next ? 'Далі о ' + next.start : 'До ' + live.end) + '</span></div>' + joinButtons(live.name) + '</section>';
    }
    if (next) {
      var wait = toMin(next.start) - now.min;
      return '<section class="hero"><div class="kicker">Наступна пара · о ' + next.start + '</div>' +
        '<h2>' + esc(next.name) + '</h2>' + metaHtml(next).replace('class="meta"', 'class="meta" style="margin-top:8px"') +
        '<div class="stats" style="margin-top:14px"><span>Почнеться через <b>' + dur(wait) + '</b></span><span>до ' + next.end + '</span></div>' +
        (wait <= 30 ? joinButtons(next.name) : '') + '</section>';
    }
    var nd = nextDayWithPairs(dt), np = nd && pairsFor(nd)[0];
    return '<section class="hero"><div class="kicker">' + (list.length ? 'На сьогодні пари закінчились' : 'Сьогодні пар немає') +
      '</div>' + (np ? '<h2>' + esc(np.name) + '</h2><div class="meta" style="margin-top:6px">' + DAY_FULL[dow(nd)] +
      ', ' + human(nd) + ' о ' + np.start + '</div>' : '') + '</section>';
  }

  function renderDay(dt, isToday) {
    var now = kyivNow(), list = pairsFor(dt), html = '';
    if (isToday) html += heroHtml(dt, list, now);
    html += '<div class="sec' + (isToday ? ' today' : '') + '"><b>' + DAY_FULL[dow(dt)] + ', ' + human(dt) +
      '</b><span>' + weekOf(dt) + '-й тиждень</span></div>';
    if (!list.length) return html + '<div class="group empty">Пар немає — можна відпочити</div>';
    html += '<div class="group">';
    list.forEach(function (p) {
      var o = {};
      if (isToday) { o.live = now.min >= toMin(p.start) && now.min < toMin(p.end); o.past = now.min >= toMin(p.end); }
      html += rowHtml(p, o);
    });
    return html + '</div>';
  }

  function renderWeek() {
    var mon = addDays(monday(state.baseDate), 7 * state.weekShift);
    var html = '<div class="seg" id="wk" style="margin-top:12px"><span class="thumb"></span>' +
      '<button data-w="0" class="' + (state.weekShift === 0 ? 'on' : '') + '">Цей тиждень</button>' +
      '<button data-w="1" class="' + (state.weekShift === 1 ? 'on' : '') + '">Наступний</button></div>';
    html += '<div class="range">' + human(mon) + ' – ' + human(addDays(mon, 5)) + ' · ' + weekOf(mon) + '-й тиждень</div>';
    var today = iso(state.baseDate), any = false;
    for (var i = 0; i < 6; i++) {
      var d = addDays(mon, i), list = pairsFor(d);
      if (!list.length) continue;
      any = true;
      html += '<div class="sec' + (iso(d) === today ? ' today' : '') + '"><b>' + DAY_FULL[i] + '</b><span>' + human(d) + '</span></div><div class="group">';
      list.forEach(function (p) { html += rowHtml(p, {}); });
      html += '</div>';
    }
    if (!any) html += '<div class="group empty" style="margin-top:16px">Пар немає</div>';
    return html;
  }

  function placeThumb(seg) {
    if (!seg) return;
    var btns = seg.querySelectorAll('button'), thumb = seg.querySelector('.thumb'), idx = 0;
    Array.prototype.forEach.call(btns, function (b, i) { if (b.classList.contains('on')) idx = i; });
    thumb.style.width = 'calc((100% - 4px) / ' + btns.length + ')';
    thumb.style.transform = 'translateX(' + (idx * 100) + '%)';
  }

  function render() {
    var main = document.getElementById('main');
    if (!state.data) return;
    LINKS = [];
    var n = kyivNow();
    state.baseDate = dateUTC(n.y, n.m, n.d);
    document.getElementById('title').textContent = state.group.name;
    document.getElementById('sub').textContent = DAY_FULL[dow(state.baseDate)] + ', ' + human(state.baseDate) + ' · ' +
      weekOf(state.baseDate) + '-й тиждень';
    if (state.view === 'today') main.innerHTML = renderDay(state.baseDate, true);
    else if (state.view === 'tomorrow') main.innerHTML = renderDay(addDays(state.baseDate, 1), false);
    else main.innerHTML = renderWeek();
    var wk = document.getElementById('wk');
    if (wk) {
      placeThumb(wk);
      Array.prototype.forEach.call(wk.querySelectorAll('[data-w]'), function (b) {
        b.onclick = function () {
          var w = +b.getAttribute('data-w');
          if (w === state.weekShift) return;
          haptic('sel'); state.weekShift = w; render();
        };
      });
    }
  }

  function getJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function load() {
    var gid = state.group.id;
    var cached = read('rozklad_cache_' + gid);
    if (cached) {
      try { var c = JSON.parse(cached); if (c.ref) { state.data = c.data; state.currentWeek = c.week; state.refDate = new Date(c.ref + 'T00:00:00Z'); render(); } } catch (e) {}
    }
    Promise.all([getJSON(API + '/schedule/lessons?groupId=' + encodeURIComponent(gid)), getJSON(API + '/time/current')])
      .then(function (r) {
        state.data = r[0];
        state.currentWeek = r[1].currentWeek;
        var n = kyivNow(); state.refDate = dateUTC(n.y, n.m, n.d);
        store('rozklad_cache_' + gid, JSON.stringify({ data: state.data, week: state.currentWeek, ref: iso(state.refDate) }));
        render();
      })
      .catch(function () {
        if (!state.data) {
          document.getElementById('sub').textContent = 'Немає зв’язку';
          document.getElementById('main').innerHTML = '<div class="group err" style="margin-top:16px">Не вдалося завантажити розклад. Перевірте інтернет і відкрийте ще раз.</div>';
        }
      });
  }

  // ---- вибір групи ----
  var groupsCache = null;
  function openGroupPicker() {
    var main = document.getElementById('main');
    main.innerHTML = '<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
      '<input id="q" placeholder="Назва групи, напр. ГС-61мп" autocomplete="off"></label>' +
      '<div class="group glist" id="gl"><div class="hint">Завантаження списку груп…</div></div>';
    var q = document.getElementById('q'), gl = document.getElementById('gl');
    function draw() {
      if (!groupsCache) return;
      var s = q.value.trim().toLowerCase();
      var list = groupsCache.filter(function (g) { return !s || g.name.toLowerCase().indexOf(s) >= 0; }).slice(0, 40);
      gl.innerHTML = list.map(function (g) {
        return '<button data-id="' + g.id + '" data-name="' + esc(g.name) + '"><span>' + esc(g.name) + '</span><small>' + esc(g.faculty || '') + '</small></button>';
      }).join('') || '<div class="hint">Нічого не знайдено</div>';
      Array.prototype.forEach.call(gl.querySelectorAll('button'), function (b) {
        b.onclick = function () {
          haptic('sel');
          state.group = { id: b.getAttribute('data-id'), name: b.getAttribute('data-name') };
          store('rozklad_group', JSON.stringify(state.group));
          state.data = null; setView('today'); load();
        };
      });
    }
    q.oninput = draw;
    if (groupsCache) draw();
    else getJSON(API + '/schedule/groups').then(function (g) { groupsCache = g.data || g; draw(); })
      .catch(function () { gl.innerHTML = '<div class="hint err">Не вдалося завантажити список груп</div>'; });
    q.focus();
  }

  function setView(v) {
    state.view = v;
    var tabs = document.getElementById('tabs');
    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
    placeThumb(tabs);
    render();
  }

  // ---- вікно коду доступу ----
  var modal = document.getElementById('modal'), codeIn = document.getElementById('code'),
      msg = document.getElementById('msg'), unlockBtn = document.getElementById('unlockBtn');
  function updateFoot() {
    document.getElementById('keyBtn').textContent = state.vault ? 'Посилання відкрито · Вийти' : 'Код доступу';
  }
  function openModal() {
    msg.textContent = ''; codeIn.value = '';
    modal.classList.add('open');
    setTimeout(function () { codeIn.focus(); }, 80);
  }
  function closeModal() { modal.classList.remove('open'); codeIn.blur(); }
  function submitCode() {
    var c = codeIn.value;
    if (normCode(c).length < 6) { msg.textContent = 'Введіть код повністю'; return; }
    unlockBtn.disabled = true; unlockBtn.textContent = 'Перевіряю…'; msg.textContent = '';
    decrypt(c).then(function (v) {
      state.vault = v; saveCode(normCode(c)); haptic('n', 'success');
      closeModal(); updateFoot(); render();
    }).catch(function () {
      haptic('n', 'error');
      msg.textContent = 'Код не підходить';
      var d = document.getElementById('dialog');
      d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    }).then(function () { unlockBtn.disabled = false; unlockBtn.textContent = 'Відкрити'; });
  }
  document.getElementById('keyBtn').onclick = function () {
    if (state.vault) { state.vault = null; forgetCode(); updateFoot(); render(); return; }
    openModal();
  };
  document.getElementById('scrim').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  unlockBtn.onclick = submitCode;
  codeIn.onkeydown = function (e) { if (e.key === 'Enter') submitCode(); };

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-li]');
    if (b && LINKS[+b.getAttribute('data-li')]) openLink(LINKS[+b.getAttribute('data-li')].url);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-v');
      if (v === state.view && document.getElementById('q') == null) return;
      haptic('sel'); state.weekShift = 0; setView(v);
    };
  });
  document.getElementById('grpBtn').onclick = openGroupPicker;

  placeThumb(document.getElementById('tabs'));
  load();
  restoreAccess();
  setInterval(function () { if (state.view !== 'week' && document.getElementById('q') == null) render(); }, 30000);
})();
</script>
</body>
</html>
